name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make
      - run: go test -race ./...
      - name: Package binaries
        run: tar -czf "ocrogram-darwin-$(uname -m).tar.gz" -C bin ocrogram ocrogram-helper
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ocrogram-darwin-*.tar.gz
